<pre id="master"></pre>
<script type="module">
  import { ONLINE } from "./online.js";
  import { MASTER } from "./master.js";

  async function tick(){
    try {
      const online = await ONLINE();      // ← warten
      const master = MASTER(online);       // ← jetzt ist online ein echtes Objekt
      document.getElementById("master").textContent =
        JSON.stringify(master, null, 2);
    } catch(e){
      document.getElementById("master").textContent =
        "KETTE GERISSEN · " + e.message;
    }
  }

  tick();
  setInterval(tick, 2000);
</script>
